<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin: 0;
  background: transparent;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.ticker {
  width: 100%;
  height: 42px;
  overflow: hidden;
  white-space: nowrap;
  background: #05070d;
  border: 1px solid rgba(0, 255, 255, 0.35);
  color: #ffffff;
  display: flex;
  align-items: center;
}

.ticker span {
  display: inline-block;
  padding-left: 100%;
  animation: scroll 18s linear infinite;
  font-size: 16px;
  letter-spacing: 0.5px;
  text-shadow: 0 0 8px #00ffff;
}

@keyframes scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-100%); }
}
</style>
</head>

<body>
  <div class="ticker">
    <span>🚀 Active Customers +12% | SLA Breaches -8% | Delivered Cards improved this week | International Transfers performance is stable</span>
  </div>
</body>
</html>
