<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>

body {
    margin: 0;
    overflow: hidden;
    background: transparent;
}

/* MAIN TICKER */

.ticker {
    width: 100%;
    height: 45px;

    display: flex;
    align-items: center;

    overflow: hidden;
    white-space: nowrap;

    background: transparent;
}

/* MOVING TEXT */

.ticker span {

    display: inline-block;

    padding-left: 100%;

    color: #ffffff;

    font-family: Arial, sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.5px;

    animation: scroll 18s linear infinite;

    text-shadow:
        0 0 5px #00ffff,
        0 0 10px #00ffff,
        0 0 20px #00ffff;
}

/* ANIMATION */

@keyframes scroll {

    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-100%);
    }
}

</style>
</head>

<body>

<div class="ticker">

<span>
🚀 Active Customers +12% &nbsp;&nbsp;&nbsp; | &nbsp;&nbsp;&nbsp;
🔥 SLA Breaches -8% &nbsp;&nbsp;&nbsp; | &nbsp;&nbsp;&nbsp;
💳 Delivered Cards improved this week &nbsp;&nbsp;&nbsp; | &nbsp;&nbsp;&nbsp;
🌍 International Transfers performance is stable
</span>

</div>

</body>
</html>
